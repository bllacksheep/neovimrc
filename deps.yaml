- name: Setup development environment
  hosts: localhost
  gather_facts: yes
  become: no
  vars:
    current_shell: "{{ ansible_facts['user_shell'] | basename }}"
    lazygit_repo: "https://github.com/jesseduffield/lazygit"
    python_env_name: "nvim"
    python_version: "3.9.0"
  tasks:
    - name: Detect operating system
      ansible.builtin.set_fact:
        is_rhel:  "{{ ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'RedHat' }}"
        is_ubuntu: "{{ ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian' }}"
        is_macos:  "{{ ansible_facts['system'] == 'Darwin'}}"

    - name: Install packages on Linux
      ansible.builtin.package:
        name: "{{ debian_packages if is_ubuntu else rhel_packages if is_rhel }}"
        state: present
      become: yes
      when: is_ubuntu or is_rhel

    - name: install fd
      block:
        - name: Download fd archive
          get_url:
            url: "{{ fd_url | regex_replace('arm64', 'aarch64') }}"
            dest: "/tmp/{{ fd_archive | regex_replace('arm64', 'aarch64') }}"
            mode: '0644'
        - name: Extract fd archive
          unarchive:
            src: "/tmp/{{ fd_archive | regex_replace('arm64', 'aarch64') }}"
            dest: "/tmp"
        - name: Install fd binary
          copy:
            src: "/tmp/{{ fd_extract_dir | regex_replace('arm64', 'aarch64') }}/fd"
            dest: "/usr/local/bin/fd"
            mode: '0755'
          become: true
      when: is_rhel

    - name: Install packages on macOS
      become: false
      ansible.builtin.homebrew:
        name:
          - lazygit
          - fd
          - rg
          - npm
      when: is_macos


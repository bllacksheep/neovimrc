---
- name: Update Ubuntu and install Neovim
  hosts: localhost
  vars:
    desired_version: "v0.12.6"
  tasks:
    - name: Detect operating system
      ansible.builtin.set_fact:
        is_rhel:   "{{ ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'RedHat' }}"
        is_ubuntu: "{{ ansible_facts['system'] == 'Linux' and ansible_facts['os_family'] == 'Debian' }}"
        is_macos:  "{{ ansible_facts['system'] == 'Darwin' }}"
  
    - name: Detect linux
      ansible.builtin.set_fact:
        is_linux:  "{{ is_rhel or is_ubuntu }}"

    - name: Detect OS kernel name
      shell: uname -s
      register: kernel

    - name: Set OS kernel name
      set_fact:
         os: "{{ 'macos' if is_macos else 'linux' }}"

    - name: Check nvim version
      command: nvim -v
      become: no
      ignore_errors: true
      register: nvim

    - name: Show facts available on the system
      ansible.builtin.debug:
        var: nvim

    - name: Extract semver
      ansible.builtin.set_fact:
       installed_version : "{{ nvim.stdout_lines[0] | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+') }}"
      when: nvim.failed == false

    - name: Installed version
      debug:
        msg: "{{ installed_version }}"
      when: nvim.failed == false

    - name: Continue?
      assert:
        that:
          - "installed_version is version(desired_version, '<=')"
        fail_msg: "Neovim is already up-to-date ({{ installed_version }} >= {{ desired_version }}). Skipping upgrade."
        success_msg: "Neovim needs upgrade ({{ installed_version }} < {{ desired_version }}). Continuing."
      when: nvim.failed == false and 'bypassversioncheck' not in ansible_run_tags
      tags: ["always"]

    - name: Install dependencies for Neovim
      package:
        name:
          - tree-sitter-cli
          - git
          - gettext
          - unzip
          - curl
          - gnu-tar
          - npm
          - lazygit
          - fd
          - npm
        state: present
      become: yes
      when: is_linux

    - name: Install packages on macOS
      become: false
      ansible.builtin.homebrew:
        name:
          - tree-sitter-cli
          - git
          - gettext
          - unzip
          - curl
          - gnu-tar
          - npm
          - lazygit
          - fd
          - npm
      when: is_macos

    - name: Use Nightly
      set_fact:
        desired_version: "nightly"
      tags: ["nightly"]

    - name: Download Neovim latest release
      get_url:
        url: "https://github.com/neovim/neovim/releases/download/{{ desired_version }}/nvim-{{ os }}-{{ ISA }}.tar.gz"
        dest: "/tmp/nvim-{{ os }}-{{ ISA }}.tar.gz"
        mode: '0644'

    - name: Create /opt/nvim directory
      file:
        path: /opt/nvim
        state: directory
        mode: '0755'
      become: yes

    - name: Create /tmp/nvim-extracted directory
      file:
        path: /tmp/nvim-extracted
        state: directory
        mode: '0755'

    - name: Extract Neovim to /tmp for inspection
      unarchive:
        src: "/tmp/nvim-{{ os }}-{{ ISA }}.tar.gz"
        dest: /tmp/nvim-extracted
        creates: /tmp/nvim-extracted/nvim-{{ os }}-x86_64

    - name: "/tmp/nvim-extracted/nvim-{{ os }}-{{ ISA }} is empty?"
      shell: ls -lA
      args:
        chdir: "/tmp/nvim-extracted/nvim-{{ os }}-{{ ISA }}"
      register: contents

    - name: Remove previous version 
      ansible.builtin.file:
        path: "{{ item }}" 
        state: absent
      become: yes
      loop:
        - /opt/nvim
        - "{{ ansible_facts['env']['HOME'] }}/.config/nvim"

    - name: Move Neovim files to /opt/nvim
      shell: mv "/tmp/nvim-extracted/nvim-{{ os }}-{{ ISA }}/" /opt/nvim/
      when: contents["stdout_lines"] | length > 1 # total: 0 counts as 1
      become: yes

    - name: Ensure Neovim binary is executable
      file:
        path: /opt/nvim/bin/nvim
        mode: '0755'

    - name: Add Neovim to system-wide PATH
      lineinfile:
        path: /etc/profile.d/neovim.sh
        line: 'export PATH=$PATH:/opt/nvim/bin'
        create: yes
        mode: '0644'
      become: yes

    - name: Clean up downloaded tarball and extracted files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/nvim-{{ os }}-{{ ISA }}.tar.gz"
        - /tmp/nvim-extracted

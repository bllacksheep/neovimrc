---
- name: Install latest Go on Ubuntu
  hosts: all
  become: yes
  vars:
    ISA: arm64 
    go_download_base: "https://go.dev/dl/"
    go_install_dir: "/usr/local"
  tasks:

    - name: Get latest Go version
      ansible.builtin.uri:
        url: "https://go.dev/VERSION?m=text"
        return_content: yes
      register: go_version_response

    - name: Set OS 
      shell: uname -s
      register: os

    - name: Set Go version facts
      set_fact:
        go_version_string: "{{ go_version_response.content.splitlines()[0] }}"
        go_tarball: "{{ go_version_response.content.splitlines()[0] }}.{{ os.stdout | lower }}-{{ ISA }}.tar.gz"

    - name: link
      ansible.builtin.debug:
        var: go_tarball

    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "{{ go_download_base }}{{ go_tarball }}"
        dest: "/tmp/{{ go_tarball }}"
        mode: '0644'

    - name: Remove existing Go installation
      ansible.builtin.file:
        path: "{{ go_install_dir }}/go"
        state: absent

     # unarchive uses bsd tar ansible uses gnu tar
    - name: Extract Go tarball
      ansible.builtin.command:
        cmd: tar -xzf "/tmp/{{ go_tarball }}" -C "{{ go_install_dir }}"
      args:
        creates: "{{ go_install_dir }}/go"

    - name: Set Go path in /etc/profile.d
      ansible.builtin.copy:
        content: |
          export PATH=$PATH:{{ go_install_dir }}/go/bin
        dest: /etc/profile.d/go.sh
        mode: '0644'

    - name: Clean up tarball
      ansible.builtin.file:
        path: "/tmp/{{ go_tarball }}"
        state: absent
